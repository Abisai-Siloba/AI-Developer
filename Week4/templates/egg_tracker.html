<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Egg Production</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #20352b;
      background: #f3f6f1;
    }

    body {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    h1, h2 {
      margin-top: 0;
    }

    .panel {
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid #d9e3da;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 16px #20352b0d;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      align-items: end;
    }

    label {
      display: grid;
      gap: 0.4rem;
      font-weight: 600;
    }

    input, button {
      min-height: 2.75rem;
      padding: 0 0.75rem;
      border: 1px solid #aebdb1;
      border-radius: 6px;
      font: inherit;
    }

    button {
      border: 0;
      color: #fff;
      background: #24633f;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #status {
      min-height: 1.5em;
      margin-bottom: 0;
    }

    #total {
      margin: 0 0 1rem;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .filter-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: end;
      margin-bottom: 1.25rem;
    }

    .filter-controls label {
      min-width: min(100%, 220px);
    }

    .filter-controls button {
      padding: 0 1rem;
      color: #20352b;
      background: #e6eee7;
    }

    .summary-table {
      margin-bottom: 1.5rem;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 0.75rem;
      border-bottom: 1px solid #e3e9e3;
    }

    th {
      background: #f3f6f1;
    }

    @media (max-width: 520px) {
      body {
        padding: 1rem 0.75rem;
      }

      .panel {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Daily Egg Production</h1>
    <section class="panel" aria-labelledby="entry-heading">
      <h2 id="entry-heading">Log a collection</h2>
      <form id="egg-form">
        <label for="shed">Shed name
          <input id="shed" name="shed" type="text" required maxlength="100">
        </label>
        <label for="date">Collection date
          <input id="date" name="date" type="date" required>
        </label>
        <label for="count">Egg count
          <input id="count" name="count" type="number" min="0" step="1" required>
        </label>
        <button id="submit-button" type="submit">Submit</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" aria-labelledby="records-heading">
      <h2 id="records-heading">Production records</h2>
      <p id="total" aria-live="polite">Total eggs: 0</p>
      <div class="filter-controls">
        <label for="filter-date">Search by collection date
          <input id="filter-date" type="date">
        </label>
        <button id="clear-filter" type="button">Show all dates</button>
      </div>
      <h3>Shed summary</h3>
      <div class="table-wrap summary-table">
        <table>
          <thead>
            <tr>
              <th scope="col">Shed</th>
              <th scope="col">Eggs collected</th>
            </tr>
          </thead>
          <tbody id="shed-summary">
            <tr><td colspan="2">No records yet.</td></tr>
          </tbody>
        </table>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Shed</th>
              <th scope="col">Eggs collected</th>
              <th scope="col">Running total</th>
            </tr>
          </thead>
          <tbody id="records">
            <tr><td colspan="4">No records yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("egg-form");
    const submitButton = document.getElementById("submit-button");
    const statusMessage = document.getElementById("status");
    const recordsBody = document.getElementById("records");
    const totalDisplay = document.getElementById("total");
    const dateInput = document.getElementById("date");
    const filterDateInput = document.getElementById("filter-date");
    const shedSummaryBody = document.getElementById("shed-summary");
    let allRecords = [];

    function setDefaultDate() {
      const localDate = new Date(Date.now() - new Date().getTimezoneOffset() * 60000);
      dateInput.value = localDate.toISOString().slice(0, 10);
    }

    async function readResponse(response) {
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || "The server could not complete the request.");
      }
      return data;
    }

    async function loadRecords() {
      const response = await fetch("/api/eggs");
      const data = await readResponse(response);
      allRecords = data.records;
      renderRecords();
      return data;
    }

    function renderRecords() {
      const selectedDate = filterDateInput.value;
      const records = selectedDate
        ? allRecords.filter((record) => record.date === selectedDate)
        : allRecords;
      const shedTotals = new Map();
      let totalEggs = 0;
      let runningTotal = 0;

      recordsBody.replaceChildren();
      shedSummaryBody.replaceChildren();

      for (const record of records) {
        shedTotals.set(record.shed, (shedTotals.get(record.shed) || 0) + record.count);
        totalEggs += record.count;
      }

      totalDisplay.textContent = `Eggs in results: ${totalEggs}`;

      if (records.length === 0) {
        const row = recordsBody.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 4;
        cell.textContent = selectedDate
          ? "No records found for this date."
          : "No records yet.";
        const summaryRow = shedSummaryBody.insertRow();
        const summaryCell = summaryRow.insertCell();
        summaryCell.colSpan = 2;
        summaryCell.textContent = selectedDate
          ? "No shed totals for this date."
          : "No records yet.";
        return;
      }

      for (const [shed, count] of shedTotals) {
        const row = shedSummaryBody.insertRow();
        row.insertCell().textContent = shed;
        row.insertCell().textContent = count;
      }

      for (const record of records) {
        runningTotal += record.count;
        const row = recordsBody.insertRow();
        for (const value of [
          record.date,
          record.shed,
          record.count,
          runningTotal
        ]) {
          row.insertCell().textContent = value;
        }
      }
    }

    filterDateInput.addEventListener("input", renderRecords);
    document.getElementById("clear-filter").addEventListener("click", () => {
      filterDateInput.value = "";
      renderRecords();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      statusMessage.textContent = "Saving record...";

      try {
        const payload = {
          shed: form.elements.shed.value.trim(),
          date: form.elements.date.value,
          count: Number(form.elements.count.value)
        };
        const response = await fetch("/api/eggs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        await readResponse(response);
        form.reset();
        setDefaultDate();

        try {
          const data = await loadRecords();
          statusMessage.textContent = `Record saved. Total eggs: ${data.total_eggs}.`;
        } catch (error) {
          statusMessage.textContent = `Record saved, but the table could not be refreshed: ${error.message}`;
        }
      } catch (error) {
        statusMessage.textContent = `Could not save record: ${error.message}`;
      } finally {
        submitButton.disabled = false;
      }
    });

    setDefaultDate();
    loadRecords().catch((error) => {
      statusMessage.textContent = `Could not load records: ${error.message}`;
    });
  </script>
</body>
</html>
